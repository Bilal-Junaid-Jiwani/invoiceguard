# InvoiceGuard local stack.
#
#   docker compose up -d            # CLI container (interactive)
#   docker compose run --rm app check-due   # run the dunning scan once
#   # dashboard (wired by the QA worker) exposes port 8000
#
# Secrets: put them in a .env file next to this compose file
# (never commit it). Supported vars:
#   INVOICEGUARD_STRIPE_SECRET_KEY, INVOICEGUARD_STRIPE_WEBHOOK_SECRET,
#   INVOICEGUARD_SMTP_PASSWORD

services:
  app:
    build: .
    image: invoiceguard:0.1.0
    container_name: invoiceguard
    volumes:
      # persists ~/.invoiceguard (config.yaml, invoiceguard.db, templates/)
      - invoiceguard-data:/root/.invoiceguard
    env_file:
      - .env
    environment:
      - INVOICEGUARD_STRIPE_SECRET_KEY=${INVOICEGUARD_STRIPE_SECRET_KEY:-}
      - INVOICEGUARD_STRIPE_WEBHOOK_SECRET=${INVOICEGUARD_STRIPE_WEBHOOK_SECRET:-}
      - INVOICEGUARD_SMTP_PASSWORD=${INVOICEGUARD_SMTP_PASSWORD:-}
    ports:
      # dashboard web app (FastAPI/uvicorn), wired by the QA worker
      - "8000:8000"
    stdin_open: true
    tty: true

volumes:
  invoiceguard-data:
