name: install-check

# Release gate: prove the built artifact installs cleanly into an empty
# virtualenv and runs real commands, starting from outside the source tree.
# Runs on every release tag (tags are pushed before the PyPI upload) and on
# demand. If this job fails, the release must NOT be published to PyPI.
# Note: `python -m build` builds the wheel from the sdist, so a broken
# sdist already fails the build step.

on:
  push:
    tags: ["v*"]
  workflow_dispatch:

jobs:
  install-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build the release artifact
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: Install the built wheel into a clean virtualenv
        run: |
          python -m venv "$RUNNER_TEMP/clean-venv"
          "$RUNNER_TEMP/clean-venv/bin/pip" install --no-cache-dir dist/*.whl
      - name: Run real commands against the installed package
        working-directory: ${{ runner.temp }}
        env:
          HOME: ${{ runner.temp }}/ig-home
        run: |
          V="$RUNNER_TEMP/clean-venv"
          mkdir -p "$HOME"
          "$V/bin/python" -c "import invoiceguard; assert 'site-packages' in invoiceguard.__file__, invoiceguard.__file__"
          "$V/bin/invoiceguard" init
          "$V/bin/invoiceguard" freelancer list
